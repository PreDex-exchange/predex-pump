services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: predex_pump
      POSTGRES_USER: predex
      POSTGRES_PASSWORD: predex
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predex -d predex_pump"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - predex-pump-postgres:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - predex-pump-qdrant:/qdrant/storage
  redis:
    image: redis:8.2.9-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "PING"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  predex-pump-postgres:
  predex-pump-qdrant:
