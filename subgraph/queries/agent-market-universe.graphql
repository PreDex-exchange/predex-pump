query AgentMarketUniverse($now: BigInt!, $limit: Int! = 20) {
  _meta {
    block {
      number
      timestamp
    }
    hasIndexingErrors
  }
  markets(
    first: $limit
    orderBy: lastTradeAt
    orderDirection: desc
    where: { phase: "GRADUATED", tradingEndsAt_gt: $now }
  ) {
    id
    phase
    tradingEndsAt
    tradeEventCount
    lastTradeAt
    lastTradeBlock
    lastTradeTransaction
    lastTradeVenue
  }
}
